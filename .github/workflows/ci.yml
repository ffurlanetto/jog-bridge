name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run: builds a .pkg with the version of your choice.
  workflow_dispatch:
    inputs:
      version:
        description: ".pkg version"
        default: "0.0.0-dev"
        required: true

# ── GITHUB ACTIONS SECURITY ──────────────────────────────────────────────────
# Never interpolate ${{ github.event.* }} directly inside a `run:` block: a PR title or
# a commit message controlled by a third party would become shell input. Pass it
# through the environment instead:
#   env:  PR_TITLE: ${{ github.event.pull_request.title }}
#   run:  echo "$PR_TITLE"
# Actions outside `actions/*`: pinned by SHA (AGENTS.md A13).
# ──────────────────────────────────────────────────────────────────────────────

# A new run cancels the previous one on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # `make` contract (AGENTS.md B4): CI does not need to know the toolchain.
    # macOS 15: Xcode 16+, which ships Swift Testing.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install libusb and pkg-config
        run: make install

      # lint + typecheck + test + build + audit
      - name: Quality gate
        run: make check

      - name: Smoke test
        run: .build/release/jog-bridge --help

  package:
    name: package (.pkg)
    # Only builds the package if compilation and tests pass.
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version || '0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install libusb and pkg-config
        run: make install

      - name: Build the .pkg
        run: make pkg VERSION="$VERSION"

      - name: Check the .pkg contents
        run: |
          pkg="dist/jog-bridge-$VERSION.pkg"
          pkgutil --expand "$pkg" "$RUNNER_TEMP/pkg-check"
          test -x "$RUNNER_TEMP/pkg-check/Scripts/postinstall"
          test -f "$RUNNER_TEMP/pkg-check/Scripts/local.jog-bridge.plist"
          # The postinstall must tolerate a launchctl failure (see ADR 0006).
          grep -q kickstart "$RUNNER_TEMP/pkg-check/Scripts/postinstall"
          app="Applications/Jog Bridge.app"
          payload="$(pkgutil --payload-files "$pkg")"
          echo "$payload" | grep -qF "./$app/Contents/MacOS/jog-bridge"
          echo "$payload" | grep -qF "./$app/Contents/MacOS/jog-bridge-panel"
          echo "$payload" | grep -qF "./$app/Contents/Info.plist"
          echo "$payload" | grep -qF "./$app/Contents/Resources/AppIcon.icns"
          # No loose binary: the executable lives in the bundle only (ADR 0011).
          ! echo "$payload" | grep -q "usr/local/bin"

      - name: Check the app bundle (self-contained, consistent with the agent plist)
        run: |
          pkgutil --expand-full "dist/jog-bridge-$VERSION.pkg" "$RUNNER_TEMP/pkg-full"
          app="$RUNNER_TEMP/pkg-full/Payload/Applications/Jog Bridge.app"
          bin="$app/Contents/MacOS/jog-bridge"
          panel="$app/Contents/MacOS/jog-bridge-panel"
          test -x "$bin" && test -x "$panel"
          # The daemon links libusb statically; the panel never uses it.
          for exe in "$bin" "$panel"; do
            if otool -L "$exe" | grep -qi libusb; then
              echo "$exe depends dynamically on libusb" >&2
              exit 1
            fi
            codesign --verify --strict "$exe"
          done
          "$bin" --help > /dev/null
          codesign --verify --deep --strict "$app"
          # Clicking the app must open the panel, not start a second daemon (ADR 0012).
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "jog-bridge-panel"
          # The bundle id, the plist's AssociatedBundleIdentifiers and its program path must agree.
          plist="$RUNNER_TEMP/pkg-full/Scripts/local.jog-bridge.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          assoc_id="$(/usr/libexec/PlistBuddy -c 'Print :AssociatedBundleIdentifiers:0' "$plist")"
          program="$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:0' "$plist")"
          test "$bundle_id" = "$assoc_id"
          test "$program" = "/Applications/Jog Bridge.app/Contents/MacOS/jog-bridge"

      - name: SHA-256 checksum
        run: |
          cd dist
          shasum -a 256 "jog-bridge-$VERSION.pkg" | tee "jog-bridge-$VERSION.pkg.sha256"

      - name: Upload the .pkg as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: jog-bridge-pkg-${{ inputs.version || 'ci' }}
          path: |
            dist/jog-bridge-${{ env.VERSION }}.pkg
            dist/jog-bridge-${{ env.VERSION }}.pkg.sha256
          if-no-files-found: error
          retention-days: 14

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the secret scan must see more than the latest commit.
          fetch-depth: 0

      - name: Guardrail self-test (hooks)
        run: make test-hooks

      - name: Scan de secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
